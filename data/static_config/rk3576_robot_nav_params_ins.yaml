# tf name settings
global_world_frame: world
global_robot_frame: base_footprint
world_frame: world
robot_frame: base_link1
wio_local_frame: world
wio_link_frame: wio_link_local
dock_frame: world_dock
camera_frame: camera_link
robot_outline_r_f_frame: robot_right_front_link
robot_outline_l_f_frame: robot_left_front_link
robot_outline_l_b_frame: robot_left_back_link
robot_outline_r_b_frame: robot_right_back_link

# Robot dimensions
robot_long: 0.42
robot_wide: 0.13
robot_rear: 0.10

# Additional offsets for edge following
eg_long_add_dis: 0.02
eg_wide_add_dis: 0.01
eg_cov_long_add_dis: 0.02
eg_cov_wide_add_dis: 0.01
eg_bow_long_add_dis: 0.05
eg_bow_wide_add_dis: 0.03
eg_random_long_add_dis: 0.05
eg_random_wide_add_dis: 0.03

# Straight line trigger
straight_coll_dis: 0.22

# Bow-shaped line related parameters
obstacle_distance: 0.2
no_obstacle_distance: 0.2
used_coverage_change_angle: 0
used_gravity_angle: 0
coverage_min_gravity_angle: 0.14
coverage_gravity_decay: 0.01
coverage_change_gravity_angle: 20.0
state_change_gravity_angle: 0
used_side_dock_recharge: 0

# Docking and recharging related parameters
dock_max_observe_distance: 1.3
dock_min_observe_distance: 0.9
start_dock_recharge_distance: 1.4

# Cross Area parameters
cross_max_observe_distance: 1.1
cross_min_observe_distance: 0.8
