state_bow_observation_rate: 0.8
state_vis_egway_observation_rate: 0.50
state_vis_cov_observation_rate: 0.50
state_docking_observation_rate: 0.1

# Linear speed related
state_leavedock_back_vel: 0.20

state_random_straight_vel: 0.40
state_random_back_vel: 0.30
state_random_egway_max_linear_speed : 0.25
state_random_egway_min_linear_speed : 0.25
state_random_egway_max_angular_speed : 1.00
state_random_egway_min_angular_speed : 0.50

state_bow_straight_vel: 0.40
state_bow_back_vel: 0.30
state_bow_egway_max_linear_speed : 0.25
state_bow_egway_min_linear_speed : 0.25
state_bow_egway_max_angular_speed : 1.00
state_bow_egway_min_angular_speed : 0.50

state_vis_egway_straight_vel: 0.25
state_vis_egway_back_vel: 0.30
state_vis_egway_max_linear_speed : 0.25
state_vis_egway_min_linear_speed : 0.25
state_vis_egway_max_angular_speed : 1.20
state_vis_egway_min_angular_speed : 0.75
state_vis_egway_rotating_max_angular_speed : 0.40
state_vis_egway_rotating_min_angular_speed : 0.20

state_vis_cov_egway_straight_vel: 0.25
state_vis_cov_egway_back_vel: 0.30
state_vis_cov_egway_max_linear_speed : 0.15
state_vis_cov_egway_min_linear_speed : 0.15
state_vis_cov_egway_max_angular_speed : 1.00
state_vis_cov_egway_min_angular_speed : 0.75
state_vis_cov_egway_rotating_max_angular_speed : 0.40
state_vis_cov_egway_rotating_min_angular_speed : 0.20

egway_sim_steps: 75
coverage_sim_steps: 10
motor_max_rpm: 50
linear_rpm: 100
angular_rpm: 20

# Edge-following island parameters
island_traj_length_record: 30.0
island_angle_traj_length_record: 0.5
visual_boundary_traj_record: 999.0

# Mixed mode parameters
used_motor_current_status: 1
dense_grass_th: 70
sparse_grass_th: 40
grass_trigger_detect_period: 60000

# Recovery behavior parameters 
max_times_escape: 60

# Pure controller parameters
dock_pure_Lfc: 0.05
dock_pure_straight: 0.4
follow_pure_Lfc: 0.05
follow_pure_straight: 0.4

# Random related parameters
random_egway_long_distance: 1.0
random_egway_short_distance: 0.3
prohibided_angles_to_rotate:
  - 170
  - 180

