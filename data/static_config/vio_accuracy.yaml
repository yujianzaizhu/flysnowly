%YAML:1.0
 
#common parameters
#support: 1 imu 1 cam; 1 imu 2 cam: 2 cam; 
odom: 1
imu: 1         
num_of_cam: 2  

odom_link_name: "base_car_link" 
half_img_size: 1
half_img_fps: 0

odom_topic: "/odom"
imu_topic: "/camera/imu"
# imu_topic: "/IMU_data"
image0_topic: "/camera/left/rect/image"
image1_topic: "/camera/right/rect/image"
output_path: "/userdata/"
 
cam0_calib: "left.yaml"
cam1_calib: "right.yaml"
image_width: 320
image_height: 240
   
# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 1   # 0  Have an accurate extrinsic parameters. We will trust the following imu^R_cam, imu^T_cam, don't change it.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.
 
# feynmen structure parameter
# imu_T_cam0: !!opencv-matrix #cam0 coordinate under imu coordinate
#    rows: 4
#    cols: 4
#    dt: d
#    data: [ -1.0, 0.0, 0.0, -0.007032,
#             0.0, 1.0, 0.0, 0.007035,
#             0.0, 0.0, -1., -0.015,
#             0. , 0. , 0. ,  1.       ]

# imu_T_cam1: !!opencv-matrix
#    rows: 4
#    cols: 4
#    dt: d
#    data: [ -1.0, 0.0, 0.0, -0.06232,
#             0.0, 1.0, 0.0,  0.007035,
#             0.0, 0.0, -1.,  -0.015,
#             0. , 0. , 0. , 1.       ]

# kalibr calibration parameter
imu_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [-0.99991405, -0.00792728, -0.01044286, -0.0056307,
         -0.00781202,  0.99990863, -0.011032,    0.00563432,
         0.01052936, -0.01094947, -0.99988461, -0.0368283,
         0. ,         0. ,         0. ,         1.       ]

imu_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [-0.99991074, -0.00810673, -0.01062044, -0.06070705,
         -0.00799628,  0.99991393, -0.01040188,  0.00544047,
         0.01070385, -0.01031603, -0.9998895,  -0.03682588,
         0. ,         0. ,         0. ,         1.       ]

body_T_imu: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [0.0000000, -0.1736482, -0.9848077, 0.36,
          1.0000000,  0.0000000,  0.0000000, 0.025,
          0.0000000, -0.9848077,  0.1736482, 0.0, 
          0.0000000,  0.0000000,  0.0000000, 1.0]

#body XYZ:前左上
#cam0 XYZ:右下前
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [0.0000000, 0.0000000, 1.0000000, 0.36,
          -1.0000000,  0.0000000,  0.0000000, 0.0275,
          0.0000000, -1.0000000,  0.0000000, 0.1, 
          0.0000000,  0.0000000,  0.0000000, 1.0]

body_pitch_cam: 10.0 #相机相对于水平的下倾角

#Multiple thread support
multiple_thread: 1

#feature traker paprameters
use_gftt: 1
use_clahe: 0
max_cnt: 150            # max feature number in feature tracking
min_dist: 15            # min distance between two features 
border_size: 4          # mask border size
freq: 10                # frequence (Hz) of publish tracking result. At least 10Hz for good estimation. If set 0, the frequence will be same as raw image 
F_threshold: 1.0        # ransac threshold (pixel)
show_track: 1           # publish tracking image as topic
flow_back: 1            # perform forward and backward optical flow to improve feature tracking accuracy
klt_win_size: 9
klt_pyr_lvl: 3
 
#optimization parameters
max_solver_time: 0.04  # max solver itration time (ms), to guarantee real time
max_num_iterations: 8   # max solver itrations, to guarantee real time
keyframe_parallax: 10.0 # keyframe selection threshold (pixel)
 
#imu parameters       The more accurate parameters you provide, the better performance
acc_n: 0.1          # accelerometer measurement noise standard deviation. #0.2   0.04
gyr_n: 0.004         # gyroscope measurement noise standard deviation.     #0.05  0.004
acc_w: 0.001        # accelerometer bias random work noise standard deviation.  #0.002
gyr_w: 0.00004       # gyroscope bias random work noise standard deviation.     #4.0e-5
g_norm: 9.8         # gravity magnitude
 
#unsynchronization parameters
estimate_td: 1                      # online estimate time offset between camera and imu
td: -0.005038581                    # initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)
 
#loop closure parameters
load_previous_pose_graph: 0        # load and reuse previous pose graph; load from 'pose_graph_save_path'
pose_graph_save_path: "/home/huws/vins_output/" # save and load path
save_image: 0                   # save image in pose graph for visualization prupose; you can close this function by setting 0 
