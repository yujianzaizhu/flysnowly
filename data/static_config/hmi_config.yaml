# 组合按键超时时间
btn_comp_timeout: 5000
# 长按home键进入选择菜单
btn_home_menu: 3000
# 长按ok键返回上一层目录
btn_ok_return: 3000
# 长按关机按键进入关机
btn_power_off: 2500
# 长按ok键进入解绑app
btn_ok_unbind_app: 3000
# 长按ok键左移动
btn_ok_left_move: 1000
# 屏幕闪烁时长
display_flashing_time: 500
# 主循环检测时间
handle_cycle_time: 200
# 开发者模式登陆pin码
dev_login_pin: "0835"
# 工厂模式登陆pin码
fac_login_pin: "8350"
# cfg配置模式登陆pin码
cfg_login_pin: "0985"
# true:home键为上，则start键为下
home_up: false
# 开机登陆密码是否输入
login_pin_input: true
# true random false bow
task_random_or_bow: false
# 超时锁定，是与handle_cycle_time相关联的（单位：分钟）
timeout_lock: 1051200
# 长按start+home进入厂测模式
btn_fac_func: 10000
#按start + home + ok 进usb切换模式
btn_usb_func: 5000
# 地图确认超时时间
map_confirm_time: 10000
# 是否运行防止爆破代码
run_protect_code: true
