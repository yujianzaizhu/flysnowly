local_costmap:
  footprint: '[[-0.01,0.01], [-0.01,-0.01], [0.21,-0.01], [0.21,0.01]]'
  global_frame: world
  robot_base_frame: base_link1
  update_frequency: 10
  publish_frequency: 0.5
  transform_tolerance: 0.5
  width: 10
  height: 10
  resolution: 0.03
  robot_radius: 0.35
  footprint_padding: 0.00
  origin_x: 0
  origin_y: 0
  static_map: true
  rolling_window: true
  track_unknown_space: false
  always_send_full_costmap: false
  inscribed_radius: 0.21
  plugins:
    - name: static_layer
      type: costmap_2d::StaticLayer
    - name: obstacle_layer
      type: costmap_2d::ObstacleLayer
    - name: inflation_layer
      type: costmap_2d::InflationLayer
costmap_2d:
  GenericPlugin:
    enabled: true
  InflationPlugin:
    enabled: true
    inflation_radius: 0.4
    cost_scaling_factor: 10
    inflate_unknown: false
  ObstaclePlugin:
    observation_sources:
      - nograsscloud
      - obstaclecloud
    nograsscloud:
      data_type: PointCloud2
      sensor_frame: depth_camera
      observation_persistence: 1 #12
      expected_update_rate: 0
      marking: true
      clearing: true
      min_obstacle_height: -1
      max_obstacle_height: 5
    obstaclecloud:
      data_type: PointCloud2
      sensor_frame: depth_camera
      observation_persistence: 1 #15
      expected_update_rate: 0
      marking: true
      clearing: true
      min_obstacle_height: -1
      max_obstacle_height: 5
    enabled: true
    footprint_clearing_enabled: true
    min_obstacle_height: -1
    max_obstacle_height: 5
    combination_method:
      value: 0
      options:
        - name: Overwrite
          value: 0
          description: Overwrite values
        - name: Maximum
          value: 1
          description: Take the maximum of the values
        - name: Nothing
          value: 99
          description: Do nothing
  StaticPlugin:
    enabled: true
    map_topic: whole_map
    first_map_only: false
    subscribe_to_updates: false
    track_unknown_space: true
    use_maximum: true
    lethal_cost_threshold: 100
    unknown_cost_value: -1
    trinary_costmap: true
  VoxelPlugin:
    publish_voxel_map: true
    enabled: true
    footprint_clearing_enabled: true
    max_obstacle_height: 2
    origin_z: 0
    z_resolution: 0.2
    z_voxels: 10
    unknown_threshold: 15
    mark_threshold: 0
    combination_method:
      current_value: 1
      options:
        - name: Overwrite
          value: 0
          description: Overwrite values
        - name: Maximum
          value: 1
          description: Take the maximum of the values
        - name: Nothing
          value: 99
          description: Do nothing
